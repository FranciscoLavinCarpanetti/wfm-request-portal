name: Pruebas WFM

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "demo/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wfm-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxis JavaScript
        run: |
          node --check demo/app.js
          node --check demo/wfm-engine.js

      - name: Ejecutar pruebas del motor WFM
        run: node --test tests/wfm-engine.test.js
